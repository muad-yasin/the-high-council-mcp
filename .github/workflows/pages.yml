name: Deploy GitHub Pages

# Push trigger removed 2026-09-23: the repo is private until the open-source release, GitHub Pages is
# disabled for it (every push-triggered deploy failed "Get Pages site failed ... Not Found"), and the
# landing page now lives at https://sower-industries.de/MCP. Re-enable the push trigger when the repo
# goes public and Pages is switched back on. Manual runs still work.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
